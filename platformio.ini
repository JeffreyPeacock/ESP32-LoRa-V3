; PlatformIO Project Configuration
; Target: Heltec WiFi LoRa 32 (V3)  -- ESP32-S3FN8 + SX1262 + SSD1306
; https://heltec.org/project/wifi-lora-32-v3/

[platformio]
default_envs = heltec_wifi_lora_32_V3

[env]
; Pinned so all three sites (FLG / SJC / SNA) build byte-identical firmware.
; platform 7.0.1 resolves framework-arduinoespressif32 3.20017.x, i.e.
; Arduino-ESP32 core 2.0.17 (ESP-IDF 4.4.x).
platform = espressif32@7.0.1
board = heltec_wifi_lora_32_V3
framework = arduino

; --- Serial ---------------------------------------------------------------
; The V3 does NOT expose the ESP32-S3 native USB on its USB-C port. USB-C goes
; to a CP2102 UART bridge wired to UART0 (GPIO43/44), so the board enumerates
; as 0x10C4:0xEA60 -> /dev/ttyUSBn, not as 0x303A:0x1001. The stock board
; definition declares the native-USB hwid, so PlatformIO's port autodetect
; finds no match and falls back to "first serial port on the system" -- which
; on this machine is a bogus /dev/ttyS0. Glob the real port instead.
upload_port = /dev/ttyUSB*
monitor_port = /dev/ttyUSB*
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; --- Build ----------------------------------------------------------------
build_flags =
    ; Serial must map to UART0 (the CP2102), not to the USB-CDC peripheral.
    ; The board definition sets ARDUINO_USB_MODE=1 and leaves CDC_ON_BOOT
    ; unset; state it explicitly so a core update cannot silently move
    ; Serial onto the unwired native-USB pins.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DRADIOLIB_EXCLUDE_LORAWAN=1

build_unflags =
    -std=gnu++11
build_src_flags =
    -std=gnu++17
    -Wall
    -Wextra

; --- Libraries ------------------------------------------------------------
; RadioLib drives the SX1262 directly. Deliberately not using the Heltec
; vendor library: it bundles a patched LoRaWAN stack and its own board
; abstraction, and its SX1262 layer is a fork of an old RadioLib.
lib_deps =
    jgromes/RadioLib@^7.7.1
lib_ldf_mode = deep+

[env:heltec_wifi_lora_32_V3]
